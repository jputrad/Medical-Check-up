<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hasil Cek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    
    <p id="hasil"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const suhu = parseInt(params.get("suhu"));
    const hasil = document.getElementById("hasil");

    if (suhu >= 38) {
      hasil.textContent = "Delok Ngkas Mati";
      hasil.style.color = "red";
    } else {
      hasil.textContent = "Sehat,Sesok Mangkat Kuliah";
      hasil.style.color = "green";
    }
  </script>
</body>
</html>
